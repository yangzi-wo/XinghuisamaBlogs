name: Daily Briefing Auto Update

on:
  schedule:
    # 每小时整点检查一次，是否执行由 briefingConfig.json 中的 schedule.preferredTime 决定
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate daily briefing
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python scripts/generate_daily_briefing.py

      - name: Commit and push updated briefing data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add YZBlogs/data/dailyBriefing.json YZBlogs/data/dailyBriefingArchive.json YZBlogs/data/dailyBriefingCovers.json
          if [ -d YZBlogs/public/images/briefing ]; then git add YZBlogs/public/images/briefing; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(briefing): auto update daily briefing"
          git push
